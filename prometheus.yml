global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nl_pg_exporter"
    static_configs:
      - targets: ["host.docker.internal:9877"]
    metrics_path: /metrics
    scrape_interval: 5s